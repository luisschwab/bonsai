on: [pull_request, push]

name: CI

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: setup just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0

      - name: install nightly rustfmt
        run: rustup toolchain install nightly --component rustfmt --profile minimal

      - name: rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.9.1

      - name: check
        run: just check

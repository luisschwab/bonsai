[package]
name = "bonsai_wallet"
version = "0.1.0"
edition = "2024"
authors = ["Luis Schwab <dev@luisschwab.net>"]
description = "A desktop bitcoin wallet with an embedded Utreexo full node"
repository = "https://github.com/luisschwab/bonsai"
readme = "README.md"
license = "MIT"
keywords = ["bitcoin", "wallet", "bdk", "utreexo", "floresta"]

[[bin]]
name = "bonsai"
path = "src/bonsai.rs"

[features]
hot-reloading = ["iced/hot"]

[package.metadata.bundle]
name = "bonsai"
icon = ["assets/icon/bonsai.icns"]

[dependencies]
bdk_floresta = { git = "https://github.com/luisschwab/bdk-floresta", rev = "b558db0ca23f0d358856968f5bc459d541024dcc", default-features = false }
bdk_wallet = "2.3.0"
maxminddb = { version = "0.27", features = ["mmap"] }
iced = { version = "0.14.0", features = ["tokio", "image", "qr_code"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }
tracing-appender = "0.2"
chrono = "0.4"
regex = "1"
memmap2 = "0.9"
hex = "0.4"
bitcoin = "0.32.8"
once_cell = "1"
dirs = "6"
serde = { version = "1", features = ["derive"] }
toml = "1"
open = "5"
